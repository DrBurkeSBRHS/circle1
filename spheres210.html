<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Locus of Points</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; margin: 0; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .math-font { font-family: 'Cambria', 'Baskerville', serif; font-style: italic; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        canvas { display: block; touch-action: none; }
        
        /* Tooltip style */
        .measurement-tag {
            position: absolute;
            background: #6366f1;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -150%);
            white-space: nowrap;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen">

    <!-- Sidebar: Theory and Legend -->
    <aside class="w-full md:w-[380px] h-[40%] md:h-full glass p-6 flex flex-col gap-6 z-20 overflow-y-auto shrink-0 border-b md:border-b-0 md:border-r border-slate-800">
        <div>
            <h1 class="text-xl font-black tracking-tight text-white mb-1 uppercase">The Sphere Definition</h1>
            <p class="text-slate-400 text-xs leading-relaxed">
                A sphere is defined by a single distance constraint in a specific space.
            </p>
        </div>

        <!-- Legend: Explaining the components -->
        <div class="space-y-3 p-4 bg-slate-900/50 rounded-xl border border-white/5">
            <h2 class="text-[10px] font-bold uppercase tracking-widest text-indigo-400 mb-2">Anatomy of the Locus</h2>
            <div class="space-y-2">
                <div class="legend-item"><div class="dot bg-slate-400"></div> <span class="text-slate-300">Center (Fixed Point $C$)</span></div>
                <div class="legend-item"><div class="dot bg-yellow-400"></div> <span class="text-slate-300">Radius (Constraint $r$)</span></div>
                <div class="legend-item"><div class="dot bg-indigo-500 shadow-[0_0_10px_#6366f1]"></div> <span class="text-white">The Sphere (Points $P$)</span></div>
            </div>
        </div>

        <!-- Dimension Select -->
        <div class="space-y-3">
            <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                <button onclick="changeDim(0)" id="btn-0" class="flex-1 py-2 rounded-md text-[10px] font-bold uppercase transition-all hover:text-white text-slate-500">0-Sphere</button>
                <button onclick="changeDim(1)" id="btn-1" class="flex-1 py-2 rounded-md text-[10px] font-bold uppercase transition-all hover:text-white text-slate-500">1-Sphere</button>
                <button onclick="changeDim(2)" id="btn-2" class="flex-1 py-2 rounded-md text-[10px] font-bold uppercase transition-all hover:text-white text-slate-500 active bg-indigo-600 text-white">2-Sphere</button>
            </div>
        </div>

        <div id="explanation" class="text-xs text-slate-400 leading-relaxed space-y-3">
            <!-- Dynamic Content -->
        </div>

        <div class="mt-auto pt-4 border-t border-slate-800">
            <div class="flex items-center justify-between text-[10px] font-mono text-slate-500">
                <span>COORD SYSTEM</span>
                <span id="coord-label" class="text-indigo-400">CARTESIAN ℝ³</span>
            </div>
        </div>
    </aside>

    <!-- Main Viewport -->
    <main id="canvas-wrapper" class="relative flex-grow h-[60%] md:h-full bg-[#020617] cursor-crosshair">
        <div id="canvas-container" class="absolute inset-0"></div>
        
        <!-- Live Tag for the moving probe point -->
        <div id="dist-tag" class="measurement-tag hidden">d(P, C) = 2.0</div>

        <!-- Overlay HUD -->
        <div class="absolute top-6 left-6 pointer-events-none">
            <div class="text-xs font-black text-indigo-500/50 uppercase tracking-[0.3em]" id="space-title">Ambient Space: 3D Euclidean</div>
        </div>

        <!-- Controller -->
        <div class="absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none px-6">
            <div class="glass px-6 py-4 rounded-2xl flex items-center gap-8 pointer-events-auto max-w-md w-full shadow-2xl border-indigo-500/20">
                <div class="flex flex-col flex-grow">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-2 uppercase">
                        <span>Adjust Radius (r)</span>
                        <span class="text-yellow-400 font-mono" id="radius-val">2.00</span>
                    </div>
                    <input type="range" id="radius-slider" min="0.5" max="3.5" step="0.01" value="2" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-yellow-400">
                </div>
            </div>
        </div>
    </main>

    <script>
        let scene, camera, renderer, currentDim = 2, radius = 2;
        let sphereMesh, wireframe, probePoint, radiusLine, ambientSpace;
        const container = document.getElementById('canvas-container');
        const wrapper = document.getElementById('canvas-wrapper');
        const distTag = document.getElementById('dist-tag');

        const DIM_DATA = {
            0: { space: "1D LINE (ℝ¹)", desc: "In 1D, you move only along a line. The 'sphere' is just the two points that are exactly distance $r$ from the center." },
            1: { space: "2D PLANE (ℝ²)", desc: "In 2D, the locus of points distance $r$ from a center forms a 1D curve: a circle." },
            2: { space: "3D VOLUME (ℝ³)", desc: "In 3D, the locus is a 2D surface. Every point on this shell is perfectly equidistant from the core." }
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
            camera.position.set(6, 4, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Center Point
            const centerGeom = new THREE.SphereGeometry(0.1, 16, 16);
            const center = new THREE.Mesh(centerGeom, new THREE.MeshBasicMaterial({ color: 0x94a3b8 }));
            scene.add(center);

            // Probe Point (The moving point P)
            const probeGeom = new THREE.SphereGeometry(0.12, 16, 16);
            probePoint = new THREE.Mesh(probeGeom, new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
            scene.add(probePoint);

            // Radius Line (Constraint)
            const lineMat = new THREE.LineBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.6 });
            radiusLine = new THREE.Line(new THREE.BufferGeometry(), lineMat);
            scene.add(radiusLine);

            setupEnvironment();
            setupControls();
            resize();
            changeDim(2);
            animate();
        }

        function setupEnvironment() {
            // Visualize the "Space" based on current dimension
            ambientSpace = new THREE.Group();
            scene.add(ambientSpace);

            const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
            grid.rotation.x = Math.PI / 2;
            ambientSpace.add(grid);

            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);
            
            const light = new THREE.PointLight(0x818cf8, 1);
            light.position.set(5, 5, 5);
            scene.add(light);
        }

        function changeDim(d) {
            currentDim = d;
            // UI Updates
            document.querySelectorAll('button').forEach(b => b.classList.remove('bg-indigo-600', 'text-white'));
            document.querySelectorAll('button').forEach(b => b.classList.add('text-slate-500'));
            const activeBtn = document.getElementById(`btn-${d}`);
            activeBtn.classList.remove('text-slate-500');
            activeBtn.classList.add('bg-indigo-600', 'text-white');

            document.getElementById('space-title').innerText = `Ambient Space: ${DIM_DATA[d].space}`;
            document.getElementById('explanation').innerHTML = `<p>${DIM_DATA[d].desc}</p>`;
            document.getElementById('coord-label').innerText = d === 0 ? "LINEAR ℝ¹" : d === 1 ? "PLANAR ℝ²" : "CARTESIAN ℝ³";

            updateGeometry();
        }

        function updateGeometry() {
            if (sphereMesh) scene.remove(sphereMesh);
            if (wireframe) scene.remove(wireframe);

            const r = radius;

            if (currentDim === 0) {
                // Two points on X axis
                const geom = new THREE.BufferGeometry();
                const verts = new Float32Array([r, 0, 0, -r, 0, 0]);
                geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                sphereMesh = new THREE.Points(geom, new THREE.PointsMaterial({ color: 0x6366f1, size: 0.3 }));
            } 
            else if (currentDim === 1) {
                const geom = new THREE.RingGeometry(r - 0.05, r + 0.05, 64);
                sphereMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x6366f1, side: THREE.DoubleSide }));
            } 
            else {
                const geom = new THREE.SphereGeometry(r, 32, 32);
                sphereMesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ 
                    color: 0x6366f1, 
                    transparent: true, 
                    opacity: 0.2,
                    shininess: 100 
                }));
                wireframe = new THREE.LineSegments(
                    new THREE.WireframeGeometry(geom),
                    new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.1 })
                );
                scene.add(wireframe);
            }
            scene.add(sphereMesh);
        }

        function setupControls() {
            const slider = document.getElementById('radius-slider');
            slider.addEventListener('input', (e) => {
                radius = parseFloat(e.target.value);
                document.getElementById('radius-val').innerText = radius.toFixed(2);
                updateGeometry();
            });

            window.addEventListener('resize', resize);
        }

        function resize() {
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;
            const r = radius;

            // Update Probe Point based on Dimension logic
            let px = 0, py = 0, pz = 0;
            
            if (currentDim === 0) {
                // Oscillate between the two valid points in 1D
                px = Math.sin(t * 2) > 0 ? r : -r;
            } else if (currentDim === 1) {
                // Move along the circle in 2D
                px = Math.cos(t) * r;
                py = Math.sin(t) * r;
            } else {
                // Move in a spherical path in 3D
                px = Math.cos(t) * Math.sin(t * 0.5) * r;
                py = Math.sin(t) * Math.sin(t * 0.5) * r;
                pz = Math.cos(t * 0.5) * r;
            }

            probePoint.position.set(px, py, pz);

            // Update Radius Line
            const positions = new Float32Array([0, 0, 0, px, py, pz]);
            radiusLine.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            radiusLine.geometry.attributes.position.needsUpdate = true;

            // Update HUD Tag Position
            const vector = new THREE.Vector3(px, py, pz);
            vector.project(camera);
            const x = (vector.x * 0.5 + 0.5) * wrapper.clientWidth;
            const y = (vector.y * -0.5 + 0.5) * wrapper.clientHeight;
            
            distTag.style.display = 'block';
            distTag.style.left = `${x}px`;
            distTag.style.top = `${y}px`;
            distTag.innerText = `d(P, C) = ${r.toFixed(2)}`;

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
