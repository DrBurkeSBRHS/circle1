<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Simulations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .module-card {
            transition: all 0.2s ease-out;
            border: 1px solid #e5e7eb;
        }
        .module-card:hover {
            border-color: #1a1a1a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="selection:bg-slate-200">

    <main class="max-w-5xl mx-auto px-6 py-20">
        
        <!-- Subtle Header -->
        <header class="mb-16">
            <h1 class="text-2xl font-light tracking-tight text-slate-900 mb-2">Geometry of Circles</h1>
            <p class="text-slate-500 text-sm max-w-md">A series of interactive modules exploring the mathematical properties and physical applications of the circle.</p>
        </header>

        <!-- Dynamic Grid -->
        <div id="module-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards are injected here -->
        </div>

    </main>

    <script>
        /**
         * EXTENSION POINT: 
         * To add new modules, simply add an object to this array.
         * The UI will automatically rebuild based on this data.
         */
        const modules = [
            {
                title: "Defining the Circle",
                description: "Testing for constant distance from a central point across various 'round' shapes.",
                link: "circledef.html",
                tag: "Geometry",
                ready: true
            },
            {
                title: "Parametric Equations",
                description: "Using trigonometric functions to determine precise coordinates in space.",
                link: "parametric_circle.html",
                tag: "Mathematics",
                ready: true
            },
            {
                title: "Why is it an Ellipse?",
                description: "Play with an interactive demonstration of the string-and-pins method for drawing ellipses.",
                link: "ellipse.html",
                tag: "Geometry",
                ready: true
            },            
            {
                title: "Cross Section Explorer",
                description: "Slice 3D solids with a plane to see how circles, ellipses and other shapes appear as cross sections.",
                link: "crosssection.html",
                tag: "3D Geometry",
                ready: true
            },
            {
                title: "4 D Explorer",
                description: "Visualizing 4D objects and their 3D cross sections to understand higher-dimensional geometry.",
                link: "fourdexplorer.html",
                tag: "4D Geometry",
                ready: true
            },
            {
                title: "Collaborative Lab",
                description: "The 80% Room: A physical exercise in placing coordinates precisely in a large space.",
                link: "#",
                tag: "Lab",
                ready: false // Set to false to show "Coming Soon" or inactive state
            }
        ];

        function renderModules() {
            const grid = document.getElementById('module-grid');
            grid.innerHTML = modules.map(mod => `
                <${mod.ready ? `a href="${mod.link}"` : 'div'} class="module-card group p-8 rounded-lg flex flex-col h-full ${mod.ready ? 'cursor-pointer' : 'opacity-50 cursor-default'}">
                    <div class="mb-8">
                        <span class="text-[10px] font-medium tracking-widest uppercase text-slate-400 border-b border-slate-100 pb-1">
                            ${mod.tag}
                        </span>
                    </div>
                    
                    <h2 class="text-lg font-medium text-slate-900 mb-3 group-hover:text-black transition-colors">
                        ${mod.title}
                    </h2>
                    
                    <p class="text-sm text-slate-500 leading-relaxed flex-grow">
                        ${mod.description}
                    </p>

                    <div class="mt-8 flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-400">
                            ${mod.ready ? 'LAUNCH' : 'COMING SOON'}
                        </span>
                        ${mod.ready ? `
                            <svg class="w-4 h-4 text-slate-300 group-hover:text-black transition-all transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                            </svg>
                        ` : ''}
                    </div>
                </${mod.ready ? 'a' : 'div'}>
            `).join('');
        }

        // Initialize the grid on load
        window.addEventListener('DOMContentLoaded', renderModules);
    </script>

</body>
</html>
