<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Manifold Projection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #02040a; color: #e2e8f0; font-family: 'Inter', sans-serif; height: 100vh; margin: 0; overflow: hidden; }
        .ui-panel { background: rgba(10, 10, 20, 0.9); backdrop-filter: blur(20px); border-right: 1px solid #2e1065; }
        input[type=range] { accent-color: #a855f7; height: 5px; border-radius: 4px; appearance: none; background: #1e1b4b; }
        input[type=range]::-webkit-slider-thumb { appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #c084fc; cursor: pointer; border: 2px solid #02040a; box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        .btn-tab { flex: 1; padding: 14px 4px; font-size: 11px; font-weight: 800; transition: all 0.3s; color: #6366f1; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.15em; }
        .btn-tab.active-tab { color: #d8b4fe; border-color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .glass-card { background: rgba(15, 12, 41, 0.6); border: 1px solid #3b0764; border-radius: 12px; padding: 16px; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-full">

    <aside class="w-full md:w-80 ui-panel p-6 flex flex-col gap-6 z-10 shadow-2xl shrink-0">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-white">HYPER<span class="text-purple-500">GLYPH</span></h1>
            <p class="text-[10px] text-purple-400/60 uppercase font-bold tracking-widest mt-1">4-Plane Projection Engine</p>
        </div>

        <div class="flex border-b border-indigo-900/50">
            <button onclick="setMode('h-sphere')" id="tab-h-sphere" class="btn-tab active-tab">3-Sphere</button>
            <button onclick="setMode('tesseract')" id="tab-tesseract" class="btn-tab">Tesseract</button>
        </div>

        <div class="space-y-6">
            <div>
                <h3 class="text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-4">Ana/Kata Rotation (W-Axis)</h3>
                
                <div class="glass-card mb-4">
                    <div class="flex justify-between text-[11px] mb-2 text-purple-300 font-bold uppercase italic">XW Plane (Inside-Out)</div>
                    <input type="range" id="rot-xw" min="0" max="6.28" step="0.01" value="0.8" class="w-full">
                </div>

                <div class="glass-card mb-4">
                    <div class="flex justify-between text-[11px] mb-2 text-purple-300 font-bold uppercase italic">YW Plane</div>
                    <input type="range" id="rot-yw" min="0" max="6.28" step="0.01" value="0" class="w-full">
                </div>

                <div class="glass-card">
                    <div class="flex justify-between text-[11px] mb-2 text-purple-300 font-bold uppercase italic">ZW Plane</div>
                    <input type="range" id="rot-zw" min="0" max="6.28" step="0.01" value="0" class="w-full">
                </div>
            </div>
        </div>

        <div class="glass-card border-purple-500/20 bg-purple-500/5 mt-auto">
            <p class="text-[11px] text-indigo-200/70 leading-relaxed" id="info-box">
                Rendering a 3-Sphere using 4D parallels and meridians. Notice how the spherical "slices" expand and contract as they rotate through the W-axis.
            </p>
        </div>
    </aside>

    <main class="flex-grow relative overflow-hidden">
        <div id="container" class="w-full h-full"></div>
    </main>

    <script>
        let scene, camera, renderer, mainGroup;
        let mode = 'h-sphere';
        const R = 2.0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 4, 7);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            document.getElementById('container').appendChild(renderer.domElement);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            setupEvents();
            onResize();
            renderLoop();
        }

        function rotate4D(p, xw, yw, zw) {
            let [x, y, z, w] = p;
            let c, s;
            // XW
            c = Math.cos(xw); s = Math.sin(xw);
            [x, w] = [x * c - w * s, x * s + w * c];
            // YW
            c = Math.cos(yw); s = Math.sin(yw);
            [y, w] = [y * c - w * s, y * s + w * c];
            // ZW
            c = Math.cos(zw); s = Math.sin(zw);
            [z, w] = [z * c - w * s, z * s + w * c];
            return [x, y, z, w];
        }

        function project(p4) {
            const d = 4.0; // 4D camera distance
            const f = d / (d - p4[3]);
            return new THREE.Vector3(p4[0] * f, p4[1] * f, p4[2] * f);
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-' + m).classList.add('active-tab');
            document.getElementById('info-box').innerText = m === 'h-sphere' 
                ? "Rendering a 3-Sphere using 4D parallels and meridians. Rotating through W causes the polar collapse effect."
                : "A Tesseract (Hypercube). Removed the center point. Every edge represents a connection in 4D space.";
        }

        function createHypersphereMesh(xw, yw, zw) {
            const lines = [];
            const rings = 8; 
            const segments = 16;
            
            // 4D Hypersphere parametric:
            // x = R sin(psi) sin(theta) cos(phi)
            // y = R sin(psi) sin(theta) sin(phi)
            // z = R sin(psi) cos(theta)
            // w = R cos(psi)
            
            // Draw 4D meridians and parallels
            for (let i = 1; i < rings; i++) {
                const psi = (i / rings) * Math.PI;
                
                // Ring in theta/phi
                const points = [];
                for (let j = 0; j <= segments; j++) {
                    const theta = (j / segments) * Math.PI;
                    for(let k = 0; k <= segments; k++) {
                        const phi = (k / segments) * 2 * Math.PI;
                        
                        // We draw select circles to represent the "curved grid"
                        if (k === 0 || k === segments/2) {
                            const x = R * Math.sin(psi) * Math.sin(theta) * Math.cos(phi);
                            const y = R * Math.sin(psi) * Math.sin(theta) * Math.sin(phi);
                            const z = R * Math.sin(psi) * Math.cos(theta);
                            const w = R * Math.cos(psi);
                            points.push(project(rotate4D([x,y,z,w], xw, yw, zw)));
                        }
                    }
                }
                
                // Draw latitude circles
                for (let j = 1; j < rings; j++) {
                    const theta = (j/rings) * Math.PI;
                    const latCircle = [];
                    for (let k = 0; k <= segments; k++) {
                        const phi = (k/segments) * 2 * Math.PI;
                        const x = R * Math.sin(psi) * Math.sin(theta) * Math.cos(phi);
                        const y = R * Math.sin(psi) * Math.sin(theta) * Math.sin(phi);
                        const z = R * Math.sin(psi) * Math.cos(theta);
                        const w = R * Math.cos(psi);
                        latCircle.push(project(rotate4D([x,y,z,w], xw, yw, zw)));
                    }
                    lines.push(latCircle);
                }
            }
            return lines;
        }

        function createTesseractEdges(xw, yw, zw) {
            const vertices = [];
            for (let i = 0; i < 16; i++) {
                const p4 = [
                    (i & 1 ? 1 : -1) * 1.2,
                    (i & 2 ? 1 : -1) * 1.2,
                    (i & 4 ? 1 : -1) * 1.2,
                    (i & 8 ? 1 : -1) * 1.2
                ];
                vertices.push(project(rotate4D(p4, xw, yw, zw)));
            }
            
            const edges = [];
            for (let i = 0; i < 16; i++) {
                for (let j = i + 1; j < 16; j++) {
                    let diff = 0;
                    for (let k = 0; k < 4; k++) {
                        if (((i >> k) & 1) !== ((j >> k) & 1)) diff++;
                    }
                    if (diff === 1) edges.push([vertices[i], vertices[j]]);
                }
            }
            return edges;
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            mainGroup.clear();

            const xw = parseFloat(document.getElementById('rot-xw').value);
            const yw = parseFloat(document.getElementById('rot-yw').value);
            const zw = parseFloat(document.getElementById('rot-zw').value);

            if (mode === 'h-sphere') {
                const paths = createHypersphereMesh(xw, yw, zw);
                paths.forEach(path => {
                    const geo = new THREE.BufferGeometry().setFromPoints(path);
                    const mat = new THREE.LineBasicMaterial({ color: 0x9333ea, transparent: true, opacity: 0.4 });
                    mainGroup.add(new THREE.Line(geo, mat));
                });
            } else {
                const edges = createTesseractEdges(xw, yw, zw);
                edges.forEach(edge => {
                    const geo = new THREE.BufferGeometry().setFromPoints(edge);
                    const mat = new THREE.LineBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.8 });
                    mainGroup.add(new THREE.Line(geo, mat));
                });
                // Add glowing vertices
                const vertGeo = new THREE.SphereGeometry(0.06, 8, 8);
                const vertMat = new THREE.MeshBasicMaterial({ color: 0xe9d5ff });
                edges.forEach(edge => {
                    [edge[0], edge[1]].forEach(pos => {
                        const m = new THREE.Mesh(vertGeo, vertMat);
                        m.position.copy(pos);
                        mainGroup.add(m);
                    });
                });
            }

            renderer.render(scene, camera);
        }

        function setupEvents() {
            window.addEventListener('resize', onResize);
            let isDown = false, lastX, lastY;
            renderer.domElement.addEventListener('pointerdown', e => { isDown = true; lastX = e.clientX; lastY = e.clientY; });
            window.addEventListener('pointerup', () => isDown = false);
            window.addEventListener('pointermove', e => {
                if(!isDown) return;
                const sph = new THREE.Spherical().setFromVector3(camera.position);
                sph.theta -= (e.clientX - lastX) * 0.01;
                sph.phi -= (e.clientY - lastY) * 0.01;
                sph.phi = Math.max(0.1, Math.min(Math.PI - 0.1, sph.phi));
                camera.position.setFromSpherical(sph);
                camera.lookAt(0,0,0);
                lastX = e.clientX; lastY = e.clientY;
            });
        }

        function onResize() {
            const container = document.getElementById('container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        init();
    </script>
</body>
</html>
